<text x='22' y='96' fill='#e7eef2' font-size='28' font-weight='700' letter-spacing='-1'>Is it real</text>
<text x='22' y='124' fill='#b2c3cd' font-size='17'>or just noise?</text>
<text x='22' y='166' fill='#7f97a5' font-size='14'>Mann–Kendall + Hamed–Rao,</text><text x='22' y='186' fill='#7f97a5' font-size='14'>false discovery control</text>
<rect x='22' y='196' width='0' height='3' rx='1.5' fill='#d6604d'><animate attributeName='width' values='0;231;231;0' keyTimes='0;.2;.9;1' dur='8s' begin='6s' repeatCount='indefinite'/></rect>
</g></svg>