<circle cx='36' cy='40' r='16' fill='#4caf88' opacity='.18'/><text x='36' y='46' fill='#4caf88' font-size='16' font-weight='700' text-anchor='middle'>2</text>
<text x='22' y='96' fill='#e7eef2' font-size='28' font-weight='700' letter-spacing='-1'>Where</text>
<text x='22' y='124' fill='#b2c3cd' font-size='17'>is it changing?</text>
<text x='22' y='166' fill='#7f97a5' font-size='14'>Every grid cell, any</text><text x='22' y='186' fill='#7f97a5' font-size='14'>region, auto hotspots</text>
<rect x='22' y='196' width='0' height='3' rx='1.5' fill='#4caf88'><animate attributeName='width' values='0;231;231;0' keyTimes='0;.2;.9;1' dur='8s' begin='2s' repeatCount='indefinite'/></rect>
</g><g transform='translate(610,20)'>
<rect width='275' height='210' rx='18' fill='#142837' stroke='#2c4557'/>
<rect width='275' height='210' rx='18' fill='none' stroke='#e08214' stroke-width='2' opacity='0'><animate attributeName='opacity' values='0;1;1;0;0' keyTimes='0;.05;.22;.27;1' dur='8s' begin='4s' repeatCount='indefinite'/></rect>
<circle cx='36' cy='40' r='16' fill='#e08214' opacity='.18'/><text x='36' y='46' fill='#e08214' font-size='16' font-weight='700' text-anchor='middle'>3</text>
<text x='22' y='96' fill='#e7eef2' font-size='28' font-weight='700' letter-spacing='-1'>How much</text>
<text x='22' y='124' fill='#b2c3cd' font-size='17'>is it changing?</text>
<text x='22' y='166' fill='#7f97a5' font-size='14'>Sen's slope per decade</text><text x='22' y='186' fill='#7f97a5' font-size='14'>and total change</text>
<rect x='22' y='196' width='0' height='3' rx='1.5' fill='#e08214'><animate attributeName='width' values='0;231;231;0' keyTimes='0;.2;.9;1' dur='8s' begin='4s' repeatCount='indefinite'/></rect>
</g><g transform='translate(905,20)'>
