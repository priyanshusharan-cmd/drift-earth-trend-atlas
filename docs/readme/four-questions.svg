<circle cx='36' cy='40' r='16' fill='#4393c3' opacity='.18'/><text x='36' y='46' fill='#4393c3' font-size='16' font-weight='700' text-anchor='middle'>1</text>
<text x='22' y='96' fill='#e7eef2' font-size='28' font-weight='700' letter-spacing='-1'>What</text>
<text x='22' y='124' fill='#b2c3cd' font-size='17'>is changing?</text>
<text x='22' y='166' fill='#7f97a5' font-size='14'>Temperature or rainfall,</text><text x='22' y='186' fill='#7f97a5' font-size='14'>any season, any years</text>
