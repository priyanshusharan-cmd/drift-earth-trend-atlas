<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 250' width='1200' height='250' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='1200' height='250' rx='20' fill='#0d1b26'/><g transform='translate(20,20)'>
