<rect width='275' height='210' rx='18' fill='none' stroke='#d6604d' stroke-width='2' opacity='0'><animate attributeName='opacity' values='0;1;1;0;0' keyTimes='0;.05;.22;.27;1' dur='8s' begin='6s' repeatCount='indefinite'/></rect>
